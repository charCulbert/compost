<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost Docs</title>
    <link rel="stylesheet" href="../src/themes.css">
    <script type="module" src="./reader.js"></script>
    <style>
      :root {
        --bg: var(--compost-theme-bg);
        --panel: var(--compost-theme-panel);
        --line: var(--compost-theme-line);
        --text: var(--compost-theme-text);
        --muted: var(--compost-theme-muted);
        --accent: var(--compost-theme-accent);
        color-scheme: var(--compost-theme-color-scheme);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); }
      a { color: inherit; }
      .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 44px; }
      header { display: flex; justify-content: space-between; gap: 16px; align-items: end; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
      h1, h2, h3, p { margin: 0; }
      .navlink { border: 1px solid var(--line); border-radius: 0; padding: 8px 12px; text-decoration: none; }
      .layout { display: grid; grid-template-columns: minmax(180px, 260px) minmax(0, 1fr); gap: 18px; align-items: start; }
      nav, article { border: 1px solid var(--line); border-radius: 0; background: var(--panel); }
      nav { display: grid; gap: 4px; padding: 10px; position: sticky; top: 16px; }
      nav a { border-radius: 0; padding: 8px 10px; color: var(--muted); text-decoration: none; }
      nav a[aria-current="page"] { background: var(--text); color: var(--bg); }
      article { min-width: 0; padding: 22px; line-height: 1.55; }
      article > * + * { margin-top: 14px; }
      article h1 { font-size: 34px; line-height: 1.1; }
      article h2 { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
      article h3 { color: var(--muted); }
      article p, article li { color: var(--muted); }
      article code { color: var(--text); }
      pre { overflow: auto; padding: 12px; border-radius: 0; background: var(--compost-theme-control-bg); }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid var(--line); padding: 7px 8px; text-align: left; }
      @media (max-width: 760px) {
        .layout { grid-template-columns: 1fr; }
        nav { position: static; }
        article { scroll-margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p>Compost</p>
          <h1>Docs</h1>
        </div>
        <a class="navlink" href="../examples/">Examples</a>
      </header>
      <div class="layout">
        <nav data-doc-list aria-label="Documentation"></nav>
        <article data-doc-content>
          <p>Loading...</p>
        </article>
      </div>
    </main>
  </body>
</html>
