<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signal Generator · Compost</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <script type="module" src="./main.js"></script>
    <style>
      body { margin: 0; color-scheme: light dark; }
      .signal-shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
      .signal-bar {
        display: flex; align-items: center; gap: 1em; padding: .75em 1em;
        border-bottom: 1px solid color-mix(in srgb, currentColor 30%, transparent);
      }
      .signal-bar h1 { margin: 0 auto 0 0; font-size: 1em; }
      .signal-main { display: grid; grid-template-columns: minmax(12em, 20em) minmax(0, 1fr); min-height: 0; }
      .signal-controls { display: grid; align-content: start; gap: 1.25em; padding: 1em; border-right: 1px solid color-mix(in srgb, currentColor 30%, transparent); }
      .signal-controls compost-knob { --compost-knob-size: 7em; }
      .signal-controls compost-slider { width: 100%; }
      .signal-scope { min-width: 0; padding: 1em; display: grid; align-content: center; }
      compost-scope { --scope-height: min(28em, 60vh); }
      .midi-drawer { position: fixed; inset: 0 auto 0 0; z-index: 20; width: min(28em, 90vw); }
      .midi-stack { display: grid; gap: 1.5em; padding: 1em; }
      .midi-stack h2 { margin: 0 0 .5em; font-size: 1em; }
      compost-piano { border-top: 1px solid color-mix(in srgb, currentColor 30%, transparent); }
      @media (max-width: 44em) {
        .signal-main { grid-template-columns: 1fr; }
        .signal-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); border-right: 0; border-bottom: 1px solid color-mix(in srgb, currentColor 30%, transparent); }
        .signal-controls compost-select, .signal-controls compost-slider { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <main class="signal-shell">
      <header class="signal-bar">
        <h1>Signal Generator</h1>
        <compost-audio start-label="Start audio" stop-label="Suspend audio"></compost-audio>
        <button type="button" data-midi-open>Open MIDI</button>
        <compost-button mode="switch" label="MIDI Map" data-midi-map-toggle></compost-button>
      </header>

      <div class="signal-main">
        <section class="signal-controls" aria-label="Oscillator controls">
          <compost-select label="Waveform" parameter-id="waveShape" value="1">
            <option value="0">Sine</option>
            <option value="1" selected>Saw</option>
            <option value="2">Square</option>
          </compost-select>
          <compost-knob parameter-id="frequency" label="Frequency" min="55" max="1760" mid="220" curve="log" value="220" unit="Hz" reset-value="220" editable></compost-knob>
          <compost-knob parameter-id="amplitude" label="Amplitude" min="0" max="1" value=".8" step=".01" reset-value=".8" editable></compost-knob>
          <compost-knob parameter-id="offset" label="Offset" min="-1" max="1" value="0" step=".01" reset-value="0" editable></compost-knob>
          <compost-slider parameter-id="outputGain" label="Output" min="0" max="1" value=".5" step=".01" reset-value=".5" editable></compost-slider>
        </section>

        <section class="signal-scope" aria-label="Oscilloscope">
          <compost-scope value-range="1" y-markers="-.5,0,.5" y-marker-labels="-.5,0,.5"></compost-scope>
        </section>
      </div>

      <compost-piano dock root-note="36" note-count="49"></compost-piano>
    </main>

    <compost-drawer class="midi-drawer" edge="left" label="MIDI">
      <div class="midi-stack">
        <section><h2>Devices</h2><compost-midi id="midi" input-only></compost-midi></section>
        <section><h2>Monitor</h2><compost-midi-monitor for="midi" max-lines="12"></compost-midi-monitor></section>
        <section><h2>Mappings</h2><compost-midi-mappings></compost-midi-mappings></section>
      </div>
    </compost-drawer>
  </body>
</html>
