<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost Signal Generator</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <script type="module" src="./main.js"></script>
    <style>
      :root { --demo-toolbar-height: 3.125em; --demo-page-pad: clamp(1em, 4vw, 2.75em); --footer-space: 9.375em; }
      * { box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body { margin: 0; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

      .app-frame {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-rows: var(--demo-toolbar-height) minmax(0, 1fr);
        height: 100vh;
        min-height: 0;
        overflow: hidden;
      }

      .demo-header {
        position: relative;
        z-index: 30;
        display: flex;
        grid-column: 1 / -1;
        grid-row: 1;
        align-items: stretch;
        min-width: 0;
        border-bottom: 1px solid var(--line);
        background: Canvas;
        font-size: .75em;
      }

      .audio-output { display: flex; flex: 1 1 auto; align-items: center; min-width: 0; }
      .audio-output > compost-audio { align-self: stretch; height: calc(var(--demo-toolbar-height) - 1px); --compost-audio-button-size: calc(var(--demo-toolbar-height) - 1px); }
      .audio-output > compost-slider { flex: 1 1 12em; width: min(100%, 18em); max-width: 18em; min-width: 10em; margin-inline: 1em; }
      .toolbar-action, .demo-header > .color-scheme-toggle { min-width: 6.5em; min-height: 100%; padding: 0 .75em; border: 0; border-left: 1px solid var(--line); background: Canvas; color: CanvasText; font: inherit; }
      .toolbar-action[aria-pressed="true"] { background: color-mix(in srgb, AccentColor 18%, Canvas); }

      .toolbar-preset { display: flex; align-items: center; flex: 0 0 15em; gap: .625em; padding: 0 .75em; border-left: 1px solid var(--line); }
      .toolbar-preset > span { color: var(--muted); }
      .toolbar-preset compost-select { flex: 1 1 auto; min-width: 0; }
      .example-link-group { display: flex; align-items: stretch; margin: 0; }
      .example-link-group .example-nav-button { min-height: 100%; border: 0; border-left: 1px solid var(--line); font-size: inherit; }
      .example-link-group .example-nav-button:first-child { display: none; }

      .midi-drawer {
        --compost-drawer-size: min(29em, 42vw);
        --compost-drawer-title-size: var(--demo-toolbar-height);
        grid-column: 1;
        grid-row: 2;
        z-index: 20;
        height: 100%;
        min-width: 0;
      }
      .midi-drawer:not([open]) { width: var(--demo-toolbar-height); }
      .midi-drawer-title { display: inline-flex; align-items: center; gap: .45em; }
      .midi-activity-led { width: .45em; height: .45em; flex: none; border-radius: 50%; background: AccentColor; opacity: .18; }
      .midi-activity-led.active { opacity: 1; }
      .drawer-stack { display: grid; gap: 1em; }
      .drawer-section { display: grid; gap: .6em; padding-bottom: 1em; border-bottom: 1px solid var(--line); }
      .drawer-section:last-child { padding-bottom: 0; border-bottom: 0; }
      .drawer-section h2 { font-size: .75em; letter-spacing: .08em; text-transform: uppercase; }
      .drawer-section p { color: var(--muted); font-size: .75em; }
      .midi-monitor-drawer { width: 100%; }

      .demo-page {
        display: flex;
        flex-direction: column;
        grid-column: 1 / -1;
        grid-row: 2;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        padding: clamp(1.375em, 3vh, 2.25em) var(--demo-page-pad) calc(var(--footer-space) + 1em);
      }
      body[data-midi-drawer-open] .demo-page { grid-column: 2; }

      .workbench { display: grid; width: min(100%, 32.5em); margin: auto; border: 1px solid var(--line); }
      .parameter-zone { display: grid; grid-template-columns: 2.625em minmax(0, 1fr); gap: .75em; align-items: center; padding: .625em; border-bottom: 1px solid var(--line); }
      .wave-shape-switch { display: grid; width: 2.625em; border: 1px solid var(--line); background: Field; }
      .wave-shape-switch button { display: grid; place-items: center; width: 2.5em; height: 2.5em; padding: 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: FieldText; }
      .wave-shape-switch button:last-child { border-bottom: 0; }
      .wave-shape-switch button[aria-pressed="true"] { background: AccentColor; color: AccentColorText; }
      .wave-shape-switch svg { width: 1.625em; height: 1.125em; fill: none; stroke: currentColor; stroke-width: 1.7; }
      .control-row { display: flex; align-items: stretch; justify-content: center; gap: .75em; }
      .control-row compost-knob { flex: 1 1 5.25em; min-width: 0; max-width: 7em; --compost-knob-size: 4.125em; }

      .scope-stack { position: relative; display: grid; min-width: 0; }
      body[data-example-id] .scope-stack compost-scope { width: 100%; --scope-height: clamp(10em, 18vw, 11em); }
      .scope-fps { position: absolute; top: .5em; right: .5em; z-index: 2; color: var(--muted); font-size: .625em; }
      .scope-controls { display: grid; grid-template-columns: auto minmax(0, 1fr); min-width: 0; border-top: 1px solid var(--line); }
      .meter-cell { display: grid; place-items: center; padding: .625em 1em; border-right: 1px solid var(--line); }
      .meter-cell compost-meter { --meter-length: 5.5em; }
      .scope-settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; }
      .scope-number-control { display: grid; gap: .35em; padding: .625em; color: var(--muted); font-size: .6875em; }
      .scope-number-control compost-number-box { width: 100%; }
      .scope-label-editor { display: grid; grid-column: 1 / -1; grid-template-columns: max-content minmax(0, 1fr); align-items: center; gap: .5em; padding: .625em; border-top: 1px solid var(--line); color: var(--muted); font-size: .6875em; }
      .scope-label-editor input { min-width: 0; min-height: 2.25em; border: 1px solid var(--line); background: Field; color: FieldText; font: inherit; }

      .keyboard-footer { position: fixed; left: var(--midi-drawer-space, 0px); right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; align-items: end; padding-top: .75em; background: Canvas; pointer-events: none; }
      .keyboard-footer compost-piano { --compost-piano-dock-offset: calc(var(--midi-drawer-space, 0px) / 2); width: min(calc(100% - 2 * var(--demo-page-pad)), 47.5em); pointer-events: auto; }

      @media (max-width: 44em) {
        :root { --footer-space: 7.875em; }
        html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
        .app-frame { display: flex; flex-direction: column; height: auto; min-height: 100dvh; overflow: visible; }
        .demo-header { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; }
        .audio-output { grid-column: 1 / -1; min-height: var(--demo-toolbar-height); border-bottom: 1px solid var(--line); }
        .toolbar-preset { min-height: var(--demo-toolbar-height); border-left: 0; }
        .demo-header > .color-scheme-toggle, .example-link-group { min-height: var(--demo-toolbar-height); }
        .midi-drawer { order: 2; width: 100%; height: auto; --compost-drawer-size: min(70dvh, 29em); }
        .midi-drawer:not([open]) { width: 100%; }
        .demo-page, body[data-midi-drawer-open] .demo-page { order: 3; width: 100%; height: auto; overflow: visible; padding: 1em var(--demo-page-pad) calc(var(--footer-space) + 1em); }
        .workbench { width: 100%; margin: 0; }
        .keyboard-footer { left: 0; }
        .keyboard-footer compost-piano { --compost-piano-dock-offset: 0px; }
      }
    </style>
  </head>
  <body data-example-id="signal-generator">
    <div class="app-frame">
      <header class="demo-header" data-example-nav>
        <div class="audio-output">
          <compost-audio modal centered-while-off start-label="⏻" stop-label="⏻" start-aria-label="Start audio" stop-aria-label="Suspend audio"></compost-audio>
          <compost-slider parameter-id="outputGain" label="Master" min="0" max="1" value=".5" step=".01" reset-value=".5" editable></compost-slider>
          <compost-button mode="switch" parameter-id="mute" label="Mute"></compost-button>
          <button class="toolbar-action" type="button" data-midi-map-toggle aria-pressed="false">MIDI Map</button>
        </div>
        <div class="toolbar-preset">
          <span>Preset</span>
          <compost-select data-signal-preset value="saw-standard" placeholder="Custom" aria-label="Preset">
            <option value="saw-standard" selected>Saw</option>
            <option value="sine-labels">Sine + labels</option>
            <option value="unipolar-square">Unipolar square</option>
          </compost-select>
        </div>
      </header>

      <compost-drawer class="midi-drawer" edge="left" resizable min-size="320" max-size="640">
        <span slot="title" class="midi-drawer-title">MIDI <span class="midi-activity-led" data-midi-activity aria-hidden="true"></span></span>
        <div class="drawer-stack">
          <section class="drawer-section"><h2>Devices</h2><compost-midi id="midi" input-only></compost-midi></section>
          <section class="drawer-section"><compost-drawer class="midi-monitor-drawer" edge="top" label="MIDI Monitor"><span slot="title">MIDI Monitor</span><compost-midi-monitor for="midi" max-lines="18"></compost-midi-monitor></compost-drawer></section>
          <section class="drawer-section"><h2>Mappings</h2><p>Choose MIDI Map, focus a parameter, then move a real MIDI CC.</p><compost-midi-mappings></compost-midi-mappings></section>
        </div>
      </compost-drawer>

      <main class="demo-page">
        <h1 class="sr-only">Signal Generator</h1>
        <section class="workbench">
          <div class="parameter-zone">
            <div class="wave-shape-switch" data-wave-shape-group parameter-id="waveShape" parameter-kind="discrete" min="0" max="2" step="1" value="1" role="group" aria-label="Wave shape" tabindex="0">
              <button type="button" data-wave-shape="0" aria-label="Sine wave" aria-pressed="false"><svg viewBox="0 0 28 18"><path d="M1 9C4 1 10 1 14 9S24 17 27 9"/></svg></button>
              <button type="button" data-wave-shape="1" aria-label="Saw wave" aria-pressed="true"><svg viewBox="0 0 28 18"><path d="M1 2L13 16V2L27 16"/></svg></button>
              <button type="button" data-wave-shape="2" aria-label="Square wave" aria-pressed="false"><svg viewBox="0 0 28 18"><path d="M1 15V3h12v12h14V3"/></svg></button>
            </div>
            <div class="control-row" aria-label="Oscillator controls">
              <compost-knob parameter-id="frequency" label="Frequency" min="55" max="1760" mid="220" curve="log" value="220" unit="Hz" reset-value="220" editable></compost-knob>
              <compost-knob parameter-id="amplitude" label="Amplitude" min="0" max="1" value=".8" step=".01" reset-value=".8" editable></compost-knob>
              <compost-knob parameter-id="offset" label="Offset" min="-1" max="1" value="0" step=".01" reset-value="0" editable></compost-knob>
            </div>
          </div>

          <div class="scope-stack">
            <compost-scope value-range="1" y-markers="-.5,0,.5" y-marker-labels="-.5,0,.5"></compost-scope>
            <output class="scope-fps" data-scope-fps aria-label="Scope render rate unavailable">— fps</output>
            <div class="scope-controls">
              <div class="meter-cell"><compost-meter label="Output" min="-60" max="6" curve="gain"></compost-meter></div>
              <div class="scope-settings">
                <label class="scope-number-control">Vertical range <compost-number-box parameter-id="scopeRange" label="Vertical range" min=".1" max="2" value="1" step=".01" reset-value="1" split-drag></compost-number-box></label>
                <label class="scope-number-control">Vertical center <compost-number-box parameter-id="scopeOffset" label="Vertical center" min="-2" max="2" value="0" step=".01" reset-value="0" split-drag></compost-number-box></label>
                <label class="scope-label-editor">Y labels <input data-scope-y-labels aria-label="Y labels" value="-.5,0,.5"></label>
              </div>
            </div>
          </div>
        </section>
        <footer class="keyboard-footer"><compost-piano dock root-note="36" note-count="49"></compost-piano></footer>
      </main>
    </div>
  </body>
</html>
