<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>compost-meter · Compost</title>
    <link rel="stylesheet" href="../shared/styles.css">
  </head>
  <body data-example-id="compost-meter">
    <main class="shell">
      <header class="topbar">
        <div>
          <p>Compost</p>
          <h1>compost-meter</h1>
        </div>
      </header>
      <div id="media"></div>
      <section class="plain">
        <h2>Default</h2>
        <div class="row">
        <compost-meter label="Output" min="-90" max="12" curve="gain"></compost-meter>
        </div>
        <output>last event: —</output>
      </section>
      <pre id="markup"></pre>
    </main>
    <script type="module">
    import { elementDemo } from '../shared/element-page.js';
    const el = 'compost-meter';
    const { s } = await elementDemo('compost-meter', { output: false });
    {
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.loop = true;
    audio.preload = 'metadata';
    audio.src = '../shared/assets/plucky.wav';
    document.getElementById('media').append(audio);
    const { connectMeters } = await import('../shared/meter-demo.js');
    connectMeters(audio, [...document.querySelectorAll('compost-meter')]);
    }
    </script>
  </body>
</html>
