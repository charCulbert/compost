<!doctype html>
<!--
  Style review page. Open ?el=compost-knob to load one element under three
  page contexts: unstyled, color-scheme: dark, and a branded serif page.
  Serve the repository root without caching: python3 examples/review/serve.py 8931
  then open http://127.0.0.1:8931/examples/review/review.html?el=compost-knob
-->
<html lang="en"><head><meta charset="utf-8"><title>Compost review</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  section { padding: 24px 32px; border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
  section h2 { font: inherit; font-size: 12px; opacity: .6; margin: 0 0 14px; text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
  output { display: block; margin-top: 12px; font-size: 12px; opacity: .7; font-family: ui-monospace, monospace; height: 1.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plain { background: white; color: black; }
  .dark  { color-scheme: dark; background: Canvas; color: CanvasText; }
  .brand { background: #f3ead8; color: #3b2a1a; font-family: Palatino, "Palatino Linotype", serif; font-size: 18px; --compost-accent: #c8412b; }
  pre { margin: 0; padding: 16px 32px; font-size: 12px; background: #f6f6f6; overflow-x: auto; }
  #media:not(:empty) { padding: 16px 32px; border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
  nav { padding: 12px 32px; font-size: 12px; line-height: 2; } nav a { margin-right: 10px; }
</style></head><body>

<!-- One template per element. Defaults only: no ::part() overrides, no custom properties. -->
<template id="compost-knob">
  <compost-knob label="Cutoff" min="20" max="20000" value="800" curve="log" unit="Hz" editable></compost-knob>
  <compost-knob label="Resonance" min="0" max="1" value="0.35"></compost-knob>
  <compost-knob label="Drive" min="0" max="10" value="3" disabled></compost-knob>
  <compost-knob label="Learning" min="0" max="1" value="0.6" data-midi-map-target-active data-midi-map-mode data-midi-map-label style="--midi-map-label:'CC 74'"></compost-knob>
</template>
<template id="compost-slider">
  <div style="width: 260px; display: grid; gap: 20px; align-self: center">
    <compost-slider label="Cutoff" min="20" max="20000" value="800" curve="log" unit="Hz" editable></compost-slider>
    <compost-slider label="Mix" value="0.5" disabled></compost-slider>
  </div>
  <compost-slider label="Level" orientation="vertical" min="-60" max="6" value="-12" step="0.5" unit=" dB" min-label="-inf" style="align-self: center"></compost-slider>
  <div style="width: 260px; display: grid; gap: 20px; align-self: center">
    <compost-slider label="Learning" value="0.7" data-midi-map-target-active data-midi-map-mode data-midi-map-label style="--midi-map-label:'CC 1'"></compost-slider>
    <compost-slider label="Cutoff (relative drag)" min="20" max="20000" value="800" curve="log" unit="Hz" interaction="relative"></compost-slider>
  </div>
</template>
<template id="compost-button">
  <compost-button label="Ping"></compost-button>
  <compost-button label="Bypass" mode="switch" pressed></compost-button>
  <compost-button label="Disabled" disabled></compost-button>
  <compost-button label="Learning" data-midi-map-target-active data-midi-map-mode data-midi-map-label style="--midi-map-label:'CC 12'"></compost-button>
</template>
<template id="compost-number-box">
  <div style="display: grid; gap: 0.4em"><span>Frequency</span><compost-number-box label="Frequency" min="20" max="20000" value="800" curve="log" unit=" Hz" split-drag></compost-number-box></div>
  <div style="display: grid; gap: 0.4em"><span>Fine tune</span><compost-number-box label="Fine tune" min="-100" max="100" value="0" step="1" unit=" ct" split-drag></compost-number-box></div>
  <div style="display: grid; gap: 0.4em"><span>Disabled</span><compost-number-box label="Disabled" value="0.5" disabled></compost-number-box></div>
  <div style="display: grid; gap: 0.4em"><span>Learning</span><compost-number-box label="Learning" value="0.6" split-drag data-midi-map-target-active data-midi-map-mode data-midi-map-label style="--midi-map-label:'CC 74'"></compost-number-box></div>
</template>
<template id="compost-select">
  <compost-select label="Waveform" parameter-id="osc-waveform" value="2">
    <option value="0">Sine</option>
    <option value="1">Triangle</option>
    <option value="2">Saw</option>
    <option value="3">Square</option>
  </compost-select>
  <compost-select label="Filter mode" parameter-id="filter-mode" value="1">
    <option value="0">Low-pass</option>
    <option value="1">Band-pass</option>
    <option value="2">High-pass</option>
  </compost-select>
  <compost-select label="Disabled" parameter-id="disabled-mode" value="0" disabled>
    <option value="0">Off</option>
    <option value="1">On</option>
  </compost-select>
  <compost-select label="Learning" parameter-id="learn-mode" value="1" data-midi-map-target-active data-midi-map-mode data-midi-map-label style="--midi-map-label:'CC 20'">
    <option value="0">Clean</option>
    <option value="1">Crunch</option>
    <option value="2">Lead</option>
  </compost-select>
</template>
<template id="compost-meter">
  <compost-meter label="Output" min="-90" max="12" curve="gain"></compost-meter>
</template>
<template id="compost-scope">
  <div style="width: min(42em, calc(100vw - 64px))">
    <compost-scope value-range="1"
      x-marker-labels="0:start,0.5:middle,1:end"
      y-marker-labels="-0.5:low,0:center,0.5:high"></compost-scope>
  </div>
</template>
<template id="compost-envelope-editor">
  <div style="width: min(38em, calc(100vw - 64px)); display: grid; gap: .65em">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 1em; flex-wrap: wrap">
      <span>Gain automation · 4 beats</span>
      <span style="display: flex; gap: 1em; font-size: .875em">
        <label><input type="checkbox" data-draw> Draw</label>
        <label><input type="checkbox" data-snap checked> Snap</label>
        <label><input type="checkbox" data-stepped> Stepped</label>
      </span>
    </div>
    <compost-envelope-editor label="Gain automation over 4 beats" duration="4" grid="0.25"
      style="height: 11em"></compost-envelope-editor>
    <small style="color: color-mix(in srgb, currentColor 65%, transparent)">Click a line to add a point; double-click or Alt-click a point to remove it. Drag empty space to select, then drag a selected point or press Cmd+D. Option-drag a segment to curve it. Shift is fine movement; Option inverts snapping for point moves.</small>
  </div>
</template>
<template id="compost-drawer">
  <div style="display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; width: min(42em, calc(100vw - 64px)); height: 20em; overflow: hidden; border: 1px solid color-mix(in srgb, currentColor 18%, transparent)">
    <compost-drawer edge="left" open resizable min-size="160" max-size="360" style="grid-row: 1 / 3; --compost-drawer-size: 240px">
      <span slot="title">Browser</span>
      Browser contents
    </compost-drawer>
    <div style="display: grid; place-items: center; min-width: 0; padding: 1em; color: color-mix(in srgb, currentColor 65%, transparent)">Workspace</div>
    <compost-drawer edge="bottom" open resizable min-size="80" max-size="180" style="grid-column: 2; --compost-drawer-size: 120px">
      <span slot="title">Device</span>
      Device contents
    </compost-drawer>
  </div>
</template>
<template id="compost-window">
  <button type="button" data-open-window>Open window</button>
  <compost-window heading="Plug-in" width="320" height="160">
    <div style="display: grid; place-items: center; height: 100%; color: color-mix(in srgb, currentColor 65%, transparent)">Plug-in contents</div>
  </compost-window>
</template>
<template id="compost-popup">
  <div data-popup-surface tabindex="0" aria-label="Context menu"
    style="display: grid; place-items: center; width: min(24em, calc(100vw - 64px)); height: 8em; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); user-select: none">
    Right-click to open context menu
  </div>
  <compost-popup heading="Context menu" label="Context menu">
    <option value="open">Open</option>
    <option value="rename">Rename</option>
    <option value="duplicate">Duplicate</option>
    <hr>
    <option value="delete">Delete</option>
  </compost-popup>
</template>
<template id="compost-device-selector">
  <compost-device-selector></compost-device-selector>
</template>
<template id="compost-midi">
  <div style="width: min(30em, calc(100vw - 64px))">
    <compost-midi></compost-midi>
  </div>
</template>
<template id="compost-midi-monitor">
  <div style="width: min(36em, calc(100vw - 64px))">
    <compost-midi-monitor></compost-midi-monitor>
  </div>
</template>
<template id="compost-midi-mappings">
  <div style="width: min(38em, calc(100vw - 64px))">
    <compost-midi-mappings></compost-midi-mappings>
  </div>
</template>
<template id="compost-audio">
  <compost-audio modal centered-while-off></compost-audio>
</template>
<template id="compost-clip-grid">
  <div style="width: min(15em, calc(100vw - 64px)); display: grid; gap: .5em">
    <span>Drums</span>
    <compost-clip-grid label="Drums" slots="5" armed selected="4" stop="active" show-stop></compost-clip-grid>
    <label><input type="checkbox" data-launch-quant checked> Launch quantization</label>
    <small style="color: color-mix(in srgb, currentColor 65%, transparent)">Click a name to select, then click its name again to rename; double-click opens. Enter launches. Drag to another slot; Option-drag copies.</small>
  </div>
</template>
<template id="compost-piano">
  <div style="width: calc(100vw - 64px); display: grid; gap: .5em">
    <span>Keyboard</span>
    <compost-piano inline root-note="60" note-count="25" aria-label="Keyboard"></compost-piano>
    <div style="display: flex; gap: 1em; flex-wrap: wrap">
      <label>Root note <input type="number" data-piano-root min="0" max="127" value="60" style="width: 5em"></label>
      <label>Keys <input type="number" data-piano-count min="1" max="128" value="25" style="width: 5em"></label>
      <label><input type="checkbox" data-piano-dock> Dock to viewport</label>
    </div>
    <small style="color: color-mix(in srgb, currentColor 65%, transparent)">Click the piano, then play with A W S E D F T G Y H U J K O L P ; — or use pointer or touch.</small>
  </div>
</template>

<div id="media"></div>
<div id="root"></div>
<pre id="markup"></pre>
<nav id="nav"></nav>
<script type="module">
  const ELEMENTS = [
    'compost-knob', 'compost-slider', 'compost-button', 'compost-number-box', 'compost-select',
    'compost-meter', 'compost-scope', 'compost-envelope-editor',
    'compost-drawer', 'compost-window', 'compost-popup', 'compost-device-selector',
    'compost-midi', 'compost-midi-monitor', 'compost-midi-mappings', 'compost-audio',
    'compost-clip-grid', 'compost-piano', 'compost-note-editor', 'compost-timeline',
  ];
  const el = new URLSearchParams(location.search).get('el') || ELEMENTS[0];
  await import(`../../src/components/${el}.js`);
  await customElements.whenDefined(el);
  const tpl = document.getElementById(el);
  const contexts = [['plain', 'Unstyled page'], ['dark', 'color-scheme: dark'], ['brand', 'Branded page: serif, 18px, --compost-accent']];
  for (const [cls, title] of contexts) {
    const s = document.createElement('section'); s.className = cls;
    s.innerHTML = `<h2>${title}</h2><div class="row"></div><output>last event: —</output>`;
    if (tpl) s.querySelector('.row').append(tpl.content.cloneNode(true));
    else s.querySelector('.row').textContent = `No template for ${el} yet: add <template id="${el}"> to this page.`;
    if (el === 'compost-audio' && cls !== 'plain') {
      const audio = s.querySelector('compost-audio');
      audio.removeAttribute('modal');
      audio.removeAttribute('centered-while-off');
    }
    customElements.upgrade(s);
    document.getElementById('root').append(s);
    const out = s.querySelector('output');
    if (el === 'compost-meter' || el === 'compost-scope') out.remove();
    else {
      for (const type of ['button-trigger', 'parameter-begin', 'parameter-edit', 'parameter-end', 'input', 'change', 'toggle', 'drawer-resize', 'window-open', 'window-close', 'window-move', 'window-resize', 'window-focus', 'popup-open', 'popup-close', 'popup-select', 'device-settings-refresh', 'device-settings-input', 'midi-ready', 'midi-devices-changed', 'midi-input-selected', 'midi-output-selected', 'midi-message', 'audio-started', 'audio-resumed', 'audio-suspended', 'audio-stopped', 'audio-state-change', 'audio-error', 'clip-launch', 'clip-stop', 'clip-record', 'clip-select', 'clip-open', 'clip-context', 'clip-rename', 'clip-delete', 'clip-duplicate', 'clip-move', 'clip-drag-start', 'clip-drag-end', 'clip-drop', 'envelope-input', 'envelope-change', 'envelope-context', 'envelope-selection'])
        s.addEventListener(type, (e) => { out.textContent = `last event: ${type} ${JSON.stringify(e.detail ?? e.target.value)}`; });
    }
    if (el === 'compost-window') {
      const windowElement = s.querySelector('compost-window');
      s.querySelector('[data-open-window]').addEventListener('click', () => {
        document.querySelectorAll('compost-window').forEach((other) => { if (other !== windowElement) other.open = false; });
        windowElement.open = true;
        windowElement.moveTo(32, 32);
        windowElement.raise();
      });
    }
    if (el === 'compost-popup') {
      const popup = s.querySelector('compost-popup');
      const surface = s.querySelector('[data-popup-surface]');
      surface.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        document.querySelectorAll('compost-popup').forEach((other) => { if (other !== popup) other.close('switch'); });
        const rect = surface.getBoundingClientRect();
        popup.openAt(event.clientX || rect.left + rect.width / 2, event.clientY || rect.top + rect.height / 2);
      });
    }
    if (el === 'compost-device-selector') {
      const selector = s.querySelector('compost-device-selector');
      let snapshot = {
        audio: {
          api: 'Core Audio',
          apis: ['Core Audio'],
          inputDevices: [{ id: 'mic', name: 'Built-in Microphone' }],
          outputDevices: [{ id: 'speakers', name: 'Built-in Output' }, { id: 'headphones', name: 'Headphones' }],
          inputDeviceId: 'mic',
          outputDeviceId: 'speakers',
          sampleRate: 48000,
          bufferSize: 128,
          sampleRates: [44100, 48000, 96000],
          bufferSizes: [64, 128, 256],
        },
        midi: {
          inputDevices: [{ id: 'keyboard', name: 'MIDI Keyboard' }],
          outputDevices: [{ id: 'synth', name: 'Hardware Synth' }],
          inputDeviceIds: ['keyboard'],
          outputDeviceIds: [],
        },
      };
      selector.connectHost({
        getSnapshot: () => snapshot,
        applySettings: (request) => {
          snapshot = {
            ...snapshot,
            audio: { ...snapshot.audio, ...request.settings.audio },
            midi: { ...snapshot.midi, ...request.settings.midi },
          };
          return snapshot;
        },
      });
    }
    if (el === 'compost-midi-monitor') {
      const monitor = s.querySelector('compost-midi-monitor');
      monitor.handleMIDIMessage([0x90, 60, 104]);
      monitor.handleMIDIMessage([0xb0, 74, 89]);
      monitor.handleMIDIMessage([0x80, 60, 0]);
      monitor.handleMIDIMessage([0xf8, 0, 0]);
    }
    if (el === 'compost-midi-mappings') {
      const { createMIDIMappings } = await import('../../src/midi-mappings.js');
      const definitions = new Map([
        ['cutoff', { parameterID: 'cutoff', name: 'Cutoff', kind: 'continuous', min: 20, max: 20000, step: 1, curve: 'log' }],
        ['resonance', { parameterID: 'resonance', name: 'Resonance', kind: 'continuous', min: 0, max: 1, step: 0.001 }],
        ['bypass', { parameterID: 'bypass', name: 'Bypass', kind: 'discrete', min: 0, max: 1, step: 1, values: [0, 1] }],
      ]);
      const mappings = createMIDIMappings({ parameterProvider: { definition: (id) => definitions.get(id) || null } });
      mappings.addEventListener('midi-mapping-request', ({ detail }) => mappings.applyMapping(detail));
      mappings.addEventListener('midi-unmapping-request', ({ detail }) => mappings.applyClear(detail.parameterID));
      mappings.applyMappings([
        { parameterID: 'cutoff', cc: 74, channel: 1, min: 80, max: 12000 },
        { parameterID: 'resonance', cc: 71, channel: null, min: 0, max: 1 },
        { parameterID: 'bypass', cc: 64, channel: null, min: 0, max: 1 },
      ]);
      s.querySelector('compost-midi-mappings').mappings = mappings;
    }
    if (el === 'compost-clip-grid') {
      const grid = s.querySelector('compost-clip-grid');
      let clips = [
        { name: 'break.a', state: 'playing', progress: .62 },
        { name: 'fill.b', state: 'stopped' },
        null,
        null,
        { name: 'ride.d', state: 'stopped' },
      ];
      let take = 1;
      let queuedRecord = null;
      const launchQuant = s.querySelector('[data-launch-quant]');
      const render = () => {
        grid.setClips(clips);
        grid.recordQueued = queuedRecord?.index ?? -1;
        if (clips.some((clip) => clip && (clip.state !== 'stopped' || clip.queued))) grid.setAttribute('stop', 'active');
        else grid.removeAttribute('stop');
      };
      const startPlayback = (index) => {
        clips = clips.map((clip, position) => {
          if (!clip) return null;
          return position === index
            ? { ...clip, state: 'playing', queued: false, progress: 0 }
            : { ...clip, state: 'stopped', queued: false };
        });
        queuedRecord = null;
        render();
      };
      const queuePlayback = (index) => {
        if (!launchQuant.checked) {
          startPlayback(index);
          return;
        }
        const queued = { ...clips[index], queued: true, progress: 0 };
        clips[index] = queued;
        queuedRecord = null;
        render();
        setTimeout(() => {
          if (clips[index] !== queued) return;
          startPlayback(index);
        }, 750);
      };
      const startRecording = (index) => {
        clips = clips.map((clip) => clip ? { ...clip, state: 'stopped', queued: false } : null);
        clips[index] = { name: `take.${take++}`, state: 'recording' };
        queuedRecord = null;
        render();
      };
      grid.addEventListener('clip-select', ({ detail }) => { grid.selected = detail.index; });
      grid.addEventListener('clip-launch', ({ detail }) => {
        const clip = clips[detail.index];
        if (!clip) return;
        if (clip.queued) {
          clips[detail.index] = { ...clip, queued: false };
        } else if (clip.state === 'recording') {
          queuePlayback(detail.index);
          return;
        } else if (clip.state === 'playing') {
          clips[detail.index] = { ...clip, state: 'stopped' };
        } else {
          clips = clips.map((other) => other?.queued
            ? { ...other, queued: false } : other);
          queuePlayback(detail.index);
          return;
        }
        render();
      });
      grid.addEventListener('clip-record', ({ detail }) => {
        if (queuedRecord?.index === detail.index) {
          queuedRecord = null;
          render();
          return;
        }
        if (!launchQuant.checked) {
          startRecording(detail.index);
          return;
        }
        clips = clips.map((clip) => clip?.queued ? { ...clip, queued: false } : clip);
        const pending = { index: detail.index };
        queuedRecord = pending;
        render();
        setTimeout(() => {
          if (queuedRecord !== pending) return;
          startRecording(detail.index);
        }, 750);
      });
      grid.addEventListener('clip-stop', () => {
        clips = clips.map((clip) => clip ? { ...clip, state: 'stopped', queued: false } : null);
        queuedRecord = null;
        render();
      });
      grid.addEventListener('clip-rename', ({ detail }) => {
        if (!clips[detail.index]) return;
        clips[detail.index] = { ...clips[detail.index], name: detail.name };
        render();
      });
      grid.addEventListener('clip-delete', ({ detail }) => {
        clips[detail.index] = null;
        if (grid.selected === detail.index) grid.selected = -1;
        render();
      });
      grid.addEventListener('clip-duplicate', ({ detail }) => {
        const to = clips.findIndex((clip) => !clip);
        if (!clips[detail.index] || to < 0) return;
        clips[to] = { ...clips[detail.index], state: 'stopped', queued: false };
        render();
      });
      grid.addEventListener('clip-move', ({ detail }) => {
        clips[detail.to] = clips[detail.index];
        clips[detail.index] = null;
        render();
      });
      grid.addEventListener('clip-drop', ({ detail }) => {
        if (detail.source !== grid || !clips[detail.fromIndex]) return;
        if (detail.copy) {
          clips[detail.toIndex] = { ...clips[detail.fromIndex], state: 'stopped', queued: false };
        } else {
          clips[detail.toIndex] = clips[detail.fromIndex];
          clips[detail.fromIndex] = null;
        }
        render();
      });
      render();
      let previousFrame = performance.now();
      const advance = (now) => {
        const delta = (now - previousFrame) / 6000;
        previousFrame = now;
        clips.forEach((clip, index) => {
          if (clip?.state !== 'playing') return;
          clip.progress = ((clip.progress ?? 0) + delta) % 1;
          grid.setProgress(index, clip.progress);
        });
        requestAnimationFrame(advance);
      };
      requestAnimationFrame(advance);
    }
    if (el === 'compost-piano') {
      const piano = s.querySelector('compost-piano');
      const root = s.querySelector('[data-piano-root]');
      const count = s.querySelector('[data-piano-count]');
      const dock = s.querySelector('[data-piano-dock]');
      const setRange = () => {
        if (root.value === '' || count.value === '') return;
        const rootNote = Math.max(0, Math.min(127, Number(root.value) || 0));
        const maxCount = 128 - rootNote;
        root.value = String(rootNote);
        count.max = String(maxCount);
        count.value = String(Math.max(1, Math.min(maxCount, Number(count.value) || 1)));
        piano.setAttribute('root-note', root.value);
        piano.setAttribute('note-count', count.value);
      };
      root.addEventListener('input', setRange);
      count.addEventListener('input', setRange);
      dock.addEventListener('change', () => {
        piano.toggleAttribute('dock', dock.checked);
        piano.toggleAttribute('inline', !dock.checked);
      });
    }
    if (el === 'compost-envelope-editor') {
      const editor = s.querySelector('compost-envelope-editor');
      editor.points = [
        { time: 0, value: 0 },
        { time: .25, value: 1 },
        { time: 1.25, value: .65 },
        { time: 2.5, value: .65 },
        { time: 4, value: 0 },
      ];
      editor.addEventListener('envelope-change', (event) => { editor.points = event.detail.points; });
      const draw = s.querySelector('[data-draw]');
      const snap = s.querySelector('[data-snap]');
      const stepped = s.querySelector('[data-stepped]');
      draw.addEventListener('change', () => editor.toggleAttribute('draw', draw.checked));
      snap.addEventListener('change', () => editor.setAttribute('snap', snap.checked ? 'grid' : 'off'));
      stepped.addEventListener('change', () => editor.toggleAttribute('stepped', stepped.checked));
    }
  }
  if (el === 'compost-window') {
    const firstWindow = document.querySelector('section.plain compost-window');
    firstWindow.open = true;
    firstWindow.moveTo(32, 32);
  }
  if (el === 'compost-popup') {
    const firstPopup = document.querySelector('section.plain compost-popup');
    const surface = document.querySelector('section.plain [data-popup-surface]');
    const rect = surface.getBoundingClientRect();
    firstPopup.openAt(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }
  if (el === 'compost-device-selector') {
    document.querySelector('section.plain compost-device-selector').open();
  }
  if (el === 'compost-meter' || el === 'compost-scope') {
    if (el === 'compost-meter') {
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.loop = true;
      audio.preload = 'metadata';
      audio.src = './assets/plucky.wav';
      document.getElementById('media').append(audio);
      const { connectMeters } = await import('./meter-review.js');
      connectMeters(audio, [...document.querySelectorAll('compost-meter')]);
    } else {
      const { setupScopeReview } = await import('./scope-review.js');
      setupScopeReview(
        document.getElementById('media'),
        [...document.querySelectorAll('compost-scope')],
      );
    }
  }
  document.getElementById('markup').textContent = tpl ? tpl.innerHTML.trim().replace(/^ {2}/gm, '') : '';
  document.getElementById('nav').innerHTML = ELEMENTS.map((n) => `<a href="?el=${n}"${n === el ? ' style="font-weight:700"' : ''}>${n}</a>`).join('');
</script>
</body></html>
