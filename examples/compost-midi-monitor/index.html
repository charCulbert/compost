<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>compost-midi-monitor · Compost</title>
    <link rel="stylesheet" href="../shared/styles.css">
  </head>
  <body data-example-id="compost-midi-monitor">
    <main class="shell">
      <header class="topbar">
        <div>
          <p>Compost</p>
          <h1>compost-midi-monitor</h1>
        </div>
      </header>
      <div id="media"></div>
      <section class="plain">
        <h2>Default</h2>
        <div class="row">
        <div style="width: min(36em, calc(100vw - 64px))">
          <compost-midi-monitor></compost-midi-monitor>
        </div>
        </div>
        <output>last event: —</output>
      </section>
    </main>
    <script type="module">
    import { elementDemo } from '../shared/element-page.js';

    const { s } = await elementDemo('compost-midi-monitor');
    {
      const monitor = s.querySelector('compost-midi-monitor');
      monitor.handleMIDIMessage([0x90, 60, 104]);
      monitor.handleMIDIMessage([0xb0, 74, 89]);
      monitor.handleMIDIMessage([0x80, 60, 0]);
      monitor.handleMIDIMessage([0xf8, 0, 0]);
    }
    </script>
  </body>
</html>
