<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>compost-device-selector · Compost</title>
    <link rel="stylesheet" href="../shared/styles.css">
  </head>
  <body data-example-id="compost-device-selector">
    <main class="shell">
      <header class="topbar">
        <div>
          <p>Compost</p>
          <h1>compost-device-selector</h1>
        </div>
      </header>
      <div id="media"></div>
      <section class="plain">
        <h2>Default</h2>
        <div class="row">
        <compost-device-selector></compost-device-selector>
        </div>
        <output>last event: —</output>
      </section>
      <pre id="markup"></pre>
    </main>
    <script type="module">
    import { elementDemo } from '../shared/element-page.js';
    const el = 'compost-device-selector';
    const { s, out } = await elementDemo('compost-device-selector');
    {
      const selector = s.querySelector('compost-device-selector');
      let snapshot = {
        audio: {
          api: 'Core Audio',
          apis: ['Core Audio'],
          inputDevices: [{ id: 'mic', name: 'Built-in Microphone' }],
          outputDevices: [{ id: 'speakers', name: 'Built-in Output' }, { id: 'headphones', name: 'Headphones' }],
          inputDeviceId: 'mic',
          outputDeviceId: 'speakers',
          sampleRate: 48000,
          bufferSize: 128,
          sampleRates: [44100, 48000, 96000],
          bufferSizes: [64, 128, 256],
        },
        midi: {
          inputDevices: [{ id: 'keyboard', name: 'MIDI Keyboard' }],
          outputDevices: [{ id: 'synth', name: 'Hardware Synth' }],
          inputDeviceIds: ['keyboard'],
          outputDeviceIds: [],
        },
      };
      selector.connectHost({
        getSnapshot: () => snapshot,
        applySettings: (request) => {
          snapshot = {
            ...snapshot,
            audio: { ...snapshot.audio, ...request.settings.audio },
            midi: { ...snapshot.midi, ...request.settings.midi },
          };
          return snapshot;
        },
      });
    }

    {
    document.querySelector('section.plain compost-device-selector').open();
    }
    </script>
  </body>
</html>
