<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>compost-select · Compost</title>
    <link rel="stylesheet" href="../shared/styles.css">
  </head>
  <body data-example-id="compost-select">
    <main class="shell">
      <header class="topbar">
        <div>
          <p>Compost</p>
          <h1>compost-select</h1>
        </div>
      </header>
      <div id="media"></div>
      <section class="plain">
        <div class="row">
        <compost-select label="Waveform" parameter-id="osc-waveform" value="2">
          <option value="0">Sine</option>
          <option value="1">Triangle</option>
          <option value="2">Saw</option>
          <option value="3">Square</option>
        </compost-select>
        <compost-select label="Filter mode" parameter-id="filter-mode" value="1">
          <option value="0">Low-pass</option>
          <option value="1">Band-pass</option>
          <option value="2">High-pass</option>
        </compost-select>
        <compost-select label="Disabled" parameter-id="disabled-mode" value="0" disabled>
          <option value="0">Off</option>
          <option value="1">On</option>
        </compost-select>
        <compost-select label="Learning" parameter-id="learn-mode" value="1" midi-map-state="active mode label" style="--midi-map-label:'CC 20'">
          <option value="0">Clean</option>
          <option value="1">Crunch</option>
          <option value="2">Lead</option>
        </compost-select>
        </div>
        <output>last event: —</output>
      </section>
    </main>
    <script type="module">
    import { elementDemo } from '../shared/element-page.js';

    await elementDemo('compost-select');
    </script>
  </body>
</html>
