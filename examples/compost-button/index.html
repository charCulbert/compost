<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>compost-button · Compost</title>
    <link rel="stylesheet" href="../shared/styles.css">
  </head>
  <body data-example-id="compost-button">
    <main class="shell">
      <header class="topbar">
        <div>
          <p>Compost</p>
          <h1>compost-button</h1>
        </div>
      </header>
      <div id="media"></div>
      <section class="plain">
        <h2>Default</h2>
        <div class="row">
        <compost-button label="Ping" parameter-id="ping"></compost-button>
        <compost-button label="Bypass" parameter-id="latch" mode="switch" pressed></compost-button>
        <compost-button label="Disabled" disabled></compost-button>
        <compost-button label="Learning" midi-map-state="active mode label" style="--midi-map-label:'CC 12'"></compost-button>
        </div>
        <output>last event: —</output>
      </section>
    </main>
    <script type="module">
    import { elementDemo } from '../shared/element-page.js';
    await elementDemo('compost-button');
    </script>
  </body>
</html>
