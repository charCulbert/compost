<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom canvas controls · Compost</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="../shared/example-page.js"></script>
    <script type="module" src="./main.js"></script>
  </head>
  <body data-example-id="custom-controls">
    <main class="shell custom-controls-shell">
      <header class="topbar" data-example-nav>
        <div>
          <p>Compost example</p>
          <h1>Custom canvas controls</h1>
        </div>
      </header>

      <section class="workbench">
        <div class="panel custom-controls-panel">
          <div class="custom-controls-stage">
            <canvas id="custom-canvas" aria-hidden="true"></canvas>
            <div id="drive-control" class="custom-control-hit"></div>
            <div id="repeats-control" class="custom-control-hit"></div>
          </div>
        </div>

        <div class="panel sibling-panel">
          <h2>Same parameter, built-in view</h2>
          <compost-knob
            parameter-id="drive"
            label="Drive"
            min="0"
            max="1"
            value="0.25"
            reset-value="0.25"
            step="0.01"
            editable
          ></compost-knob>
          <button class="example-nav-button" id="host-value" type="button">Host sets Drive to 75%</button>
        </div>

        <div class="panel wide">
          <h2>Parameter events</h2>
          <output id="events" class="log" aria-live="polite">Waiting for parameter events...</output>
        </div>
      </section>
    </main>
  </body>
</html>
