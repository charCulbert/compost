<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost Mono Synth</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <script type="module" src="./main.js"></script>
    <style>
      :root { --demo-toolbar-height: 3.125em; --demo-page-pad: clamp(1em, 4vw, 2.75em); --footer-space: 9.375em; }
      * { box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body { margin: 0; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

      .app-frame {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-rows: var(--demo-toolbar-height) minmax(0, 1fr);
        height: 100vh;
        min-height: 0;
        overflow: hidden;
      }

      .demo-header {
        position: relative;
        z-index: 30;
        display: flex;
        grid-column: 1 / -1;
        grid-row: 1;
        align-items: stretch;
        min-width: 0;
        border-bottom: 1px solid var(--line);
        background: Canvas;
        font-size: .75em;
      }

      .audio-output { display: flex; flex: 1 1 auto; align-items: center; min-width: 0; }
      .audio-output > compost-audio {
        align-self: stretch;
        height: calc(var(--demo-toolbar-height) - 1px);
        font-size: 1rem;
        --compost-audio-button-size: 6em;
        --compost-audio-centered-placeholder-width: calc(var(--demo-toolbar-height) - 1px);
        --compost-audio-centered-placeholder-height: calc(var(--demo-toolbar-height) - 1px);
        --compost-button-label-size: 1.5em;
      }
      .audio-output > compost-audio[running] {
        --compost-audio-button-size: calc(var(--demo-toolbar-height) - 1px);
        --compost-button-label-size: 1.125em;
      }
      .audio-output > compost-slider { flex: 1 1 12em; width: min(100%, 18em); max-width: 18em; min-width: 10em; margin-inline: 1em; }
      .toolbar-action, .demo-header > .color-scheme-toggle { min-width: 6.5em; min-height: 100%; padding: 0 .75em; border: 0; border-left: 1px solid var(--line); background: Canvas; color: CanvasText; font: inherit; }
      .demo-header > .color-scheme-toggle { display: grid; place-items: center; align-self: stretch; }
      .header-transport { position: absolute; inset-block: 0; left: 50%; z-index: 2; gap: 0; transform: translateX(-50%); }
      .transport.header-transport button { align-self: stretch; min-width: 3.5em; min-height: 0; padding: 0 .875em; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: transparent; }
      .transport.header-transport button + button { border-left: 0; }
      .header-transport button svg { display: block; width: .75em; height: .75em; margin: auto; fill: none; stroke: currentColor; stroke-linejoin: round; }
      .header-transport button[aria-pressed="true"] { color: var(--compost-accent, AccentColor); }
      .header-transport compost-number-box { --number-box-width: 6em; --number-box-height: 100%; align-self: stretch; gap: 0; }
      .header-transport compost-number-box::part(box) { border: 0; border-right: 1px solid var(--line); background: transparent; }
      .toolbar-action[aria-pressed="true"] { background: color-mix(in srgb, AccentColor 18%, Canvas); }

      .example-link-group { display: flex; align-items: stretch; margin: 0; }
      .example-link-group .example-nav-button { min-height: 100%; border: 0; border-left: 1px solid var(--line); font-size: inherit; }
      .example-link-group .example-nav-button:first-child { display: none; }

      .midi-drawer {
        --compost-drawer-size: min(29em, 42vw);
        --compost-drawer-title-size: var(--demo-toolbar-height);
        grid-column: 1;
        grid-row: 2;
        z-index: 20;
        height: 100%;
        min-width: 0;
      }
      .midi-drawer:not([open]) { width: var(--demo-toolbar-height); }
      .midi-drawer-title { display: inline-flex; align-items: center; gap: .45em; }
      .midi-activity-led { width: .45em; height: .45em; flex: none; border-radius: 50%; background: AccentColor; opacity: .18; }
      .midi-activity-led.active { opacity: 1; }
      .drawer-stack { display: grid; gap: 1em; }
      .drawer-section { display: grid; gap: .6em; padding-bottom: 1em; border-bottom: 1px solid var(--line); }
      .drawer-section:last-child { padding-bottom: 0; border-bottom: 0; }
      .drawer-section h2 { font-size: .75em; letter-spacing: .08em; text-transform: uppercase; }
      .midi-monitor-drawer { width: 100%; }

      .demo-page {
        display: flex;
        flex-direction: column;
        grid-column: 1 / -1;
        grid-row: 2;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: auto;
        padding: clamp(1.375em, 3vh, 2.25em) var(--demo-page-pad) calc(var(--footer-space) + 1em);
      }
      body[data-midi-drawer-open] .demo-page { grid-column: 2; }

      .workbench { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; width: min(100%, 64em); margin: auto; border: 1px solid var(--line); }
      .synth-grid { display: grid; grid-template-columns: minmax(22em, 1fr) minmax(22em, 1fr); min-width: 0; }
      .parameter-zone { display: grid; align-content: start; gap: .75em; min-width: 0; padding: .625em; border-right: 1px solid var(--line); }
      .oscillator-controls { display: flex; align-items: center; justify-content: center; gap: .75em; min-width: 0; }
      .wave-shape-select { flex: 1 1 9em; min-width: 7em; align-self: center; }
      .wave-shape-select::part(input) { min-height: 2em; padding-block: 0; }
      .oscillator-controls compost-knob { flex: 1 1 5.25em; min-width: 0; max-width: 7em; --compost-knob-size: 4.125em; }
      .adsr-controls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5em; }
      .adsr-controls compost-knob { width: 100%; min-width: 0; --compost-knob-size: 3.5em; }
      .sequence-panel { min-width: 0; border-top: 1px solid var(--line); }
      .transport { display: flex; align-items: center; gap: .625em; }
      .transport button { min-height: 2.25em; border: 1px solid currentColor; background: Canvas; color: CanvasText; font: inherit; }
      .transport compost-number-box { width: 5.5em; }
      .pitch-envelope-panel { display: grid; gap: .35em; min-width: 0; }
      .panel-label { color: var(--muted); font-size: .6875em; }
      .pitch-envelope { display: block; width: 100%; height: 4.75em; }
      .note-editor { display: block; width: 100%; height: 18em; }

      .scope-stack { display: grid; align-content: center; gap: .75em; min-width: 0; padding: .625em; }
      .scope-toolbar { display: flex; align-items: end; gap: .75em; min-width: 0; }
      .scope-label-settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75em; min-width: 0; }
      .scope-display { --scope-panel-height: clamp(7em, 12vw, 8em); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: .75em; min-width: 0; }
      body[data-example-id] .scope-display compost-scope { width: 100%; --scope-height: var(--scope-panel-height); }
      .meter-cell { display: grid; place-items: center; }
      .meter-cell compost-meter { --meter-length: var(--scope-panel-height); }
      .meter-cell compost-meter::part(label), .meter-cell compost-meter::part(legend), .meter-cell compost-meter::part(channel-labels) { display: none; }
      .scope-number-control, .scope-label-editor { display: grid; gap: .35em; min-width: 0; color: var(--muted); font-size: .6875em; }
      .scope-number-control compost-number-box { width: 7.5em; }
      .scope-label-editor input { min-width: 0; min-height: 2.25em; border: 1px solid var(--line); background: Field; color: FieldText; font: inherit; }

      .keyboard-footer { position: fixed; left: var(--midi-drawer-space, 0px); right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; align-items: end; padding-top: .75em; background: Canvas; pointer-events: none; }
      .keyboard-footer compost-piano { --compost-piano-dock-offset: calc(var(--midi-drawer-space, 0px) / 2); width: min(calc(100% - 2 * var(--demo-page-pad)), 47.5em); pointer-events: auto; }

      @media (max-width: 44em) {
        :root { --footer-space: 7.875em; }
        html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
        .app-frame { display: flex; flex-direction: column; height: auto; min-height: 100dvh; overflow: visible; }
        .demo-header { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; }
        .audio-output { grid-column: 1 / -1; min-height: var(--demo-toolbar-height); border-bottom: 1px solid var(--line); }
        .header-transport { position: static; min-height: var(--demo-toolbar-height); transform: none; }
        .demo-header > .color-scheme-toggle, .example-link-group { min-height: var(--demo-toolbar-height); }
        .midi-drawer { order: 2; width: 100%; height: auto; --compost-drawer-size: min(70dvh, 29em); }
        .midi-drawer:not([open]) { width: 100%; }
        .demo-page, body[data-midi-drawer-open] .demo-page { order: 3; width: 100%; height: auto; overflow: visible; padding: 1em var(--demo-page-pad) calc(var(--footer-space) + 1em); }
        .workbench { width: 100%; margin: 0; }
        .synth-grid { grid-template-columns: 1fr; }
        .parameter-zone { border-right: 0; border-bottom: 1px solid var(--line); }
        .keyboard-footer { left: 0; }
        .keyboard-footer compost-piano { --compost-piano-dock-offset: 0px; }
      }
    </style>
  </head>
  <body data-example-id="monosynth">
    <div class="app-frame">
      <header class="demo-header" data-example-nav>
        <div class="audio-output">
          <compost-audio modal centered-while-off start-label="⏻" stop-label="⏻" start-aria-label="Start audio" stop-aria-label="Suspend audio"></compost-audio>
          <compost-slider parameter-id="outputGain" label="Master" min="0" max="1" value=".5" step=".01" reset-value=".5" editable></compost-slider>
          <button class="toolbar-action" type="button" data-midi-map-toggle aria-pressed="false">MIDI Map</button>
        </div>
        <div class="transport header-transport">
          <button type="button" data-transport-play aria-label="Play" title="Play" aria-pressed="true">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1 9 5 1.5 9Z"></path></svg>
          </button>
          <button type="button" data-transport-stop aria-label="Stop" title="Stop">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.2 1.2h7.6v7.6h-7.6z"></path></svg>
          </button>
          <compost-number-box parameter-id="tempo" label="Tempo" min="40" max="240" value="150" step="1" unit="BPM" reset-value="150" split-drag></compost-number-box>
        </div>
      </header>

      <compost-drawer class="midi-drawer" edge="left" resizable min-size="320" max-size="640">
        <span slot="title" class="midi-drawer-title">MIDI <span class="midi-activity-led" data-midi-activity aria-hidden="true"></span></span>
        <div class="drawer-stack">
          <section class="drawer-section"><h2>Devices</h2><compost-midi id="midi" input-only></compost-midi></section>
          <section class="drawer-section"><compost-drawer class="midi-monitor-drawer" edge="top" label="MIDI Monitor"><span slot="title">MIDI Monitor</span><compost-midi-monitor for="midi" max-lines="18"></compost-midi-monitor></compost-drawer></section>
          <section class="drawer-section"><h2>Mappings</h2><compost-midi-mappings></compost-midi-mappings></section>
        </div>
      </compost-drawer>

      <main class="demo-page">
        <h1 class="sr-only">Mono Synth</h1>
        <section class="workbench">
          <div class="synth-grid">
            <div class="parameter-zone">
              <div class="oscillator-controls" aria-label="Oscillator controls">
                <compost-select class="wave-shape-select" parameter-id="waveShape" aria-label="Waveform" value="0">
                  <option value="0" selected>Sine</option>
                  <option value="1">Saw</option>
                  <option value="2">Square</option>
                </compost-select>
                <compost-knob parameter-id="amplitude" label="Amplitude" min="0" max="1" value=".8" step=".01" reset-value=".8" editable></compost-knob>
                <compost-knob parameter-id="offset" label="Offset" min="-1" max="1" value="0" step=".01" reset-value="0" editable></compost-knob>
              </div>
              <div class="adsr-controls" aria-label="Amplitude envelope controls">
                <compost-knob parameter-id="attack" label="Attack" min=".001" max="10" value=".001" step=".001" unit="s" curve="log" reset-value=".001" editable></compost-knob>
                <compost-knob parameter-id="decay" label="Decay" min=".001" max="10" value=".08" step=".001" unit="s" curve="log" reset-value=".08" editable></compost-knob>
                <compost-knob parameter-id="sustain" label="Sustain" min="0" max="1" value=".07" step=".01" reset-value=".07" editable></compost-knob>
                <compost-knob parameter-id="release" label="Release" min=".001" max="10" value=".08" step=".001" unit="s" curve="log" reset-value=".08" editable></compost-knob>
              </div>
              <div class="pitch-envelope-panel">
                <span class="panel-label">Pitch envelope</span>
                <compost-envelope-editor class="pitch-envelope" label="Pitch envelope" duration="1" min="-12" max="12" step="1"></compost-envelope-editor>
              </div>
            </div>

            <div class="scope-stack">
              <div class="scope-toolbar">
                <label class="scope-number-control">Range <compost-number-box parameter-id="scopeRange" label="Range" min=".1" max="2" value="1" step=".01" reset-value="1" split-drag></compost-number-box></label>
                <label class="scope-number-control">Offset <compost-number-box parameter-id="scopeOffset" label="Offset" min="-2" max="2" value="0" step=".01" reset-value="0" split-drag></compost-number-box></label>
              </div>
              <div class="scope-display">
                <compost-scope value-range="1" x-markers="0,.5,1" y-markers="-.5,0,.5" y-marker-labels="-.5,0,.5"></compost-scope>
                <div class="meter-cell"><compost-meter label="Output" min="-60" max="6" curve="gain"></compost-meter></div>
              </div>
              <div class="scope-label-settings">
                <label class="scope-label-editor">X labels <input data-scope-x-labels aria-label="X labels" value=""></label>
                <label class="scope-label-editor">Y labels <input data-scope-y-labels aria-label="Y labels" value="-.5,0,.5"></label>
              </div>
            </div>
          </div>
          <section class="sequence-panel">
            <compost-note-editor class="note-editor" label="Synth sequence" beats="4" start="0" end="4" loop loop-start="0" loop-end="4" time-signature="4/4" grid="1/16" adaptive-grid root-note="45" note-count="25"></compost-note-editor>
          </section>
        </section>
        <footer class="keyboard-footer"><compost-piano dock root-note="36" note-count="49"></compost-piano></footer>
      </main>
    </div>
  </body>
</html>
