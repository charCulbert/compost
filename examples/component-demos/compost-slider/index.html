<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost demo</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <script type="module" src="../../../src/components/compost-slider.js" data-usage-import></script>
    <script type="module" src="../shared-demo.js"></script>
  </head>
  <body data-demo="compost-slider">
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 data-title>Demo</h1>
          <p class="muted" data-summary></p>
        </div>
        <div class="example-link-group">
          <a class="example-nav-button" href="../../../docs/?doc=compost-slider">Docs</a>
          <a class="example-nav-button" href="../../">All examples</a>
        </div>
      </header>
      <section class="panel" data-demo-root>
        <div class="demo-playground">
          <fieldset class="demo-options">
            <legend>Options</legend>
            <label>
              Orientation
              <compost-select data-option="slider-orientation">
                <option value="horizontal" selected>Horizontal</option>
                <option value="vertical">Vertical</option>
              </compost-select>
            </label>
            <label>
              Curve
              <compost-select data-option="slider-curve">
                <option value="linear">Linear</option>
                <option value="log" selected>Log</option>
                <option value="gain">Gain</option>
              </compost-select>
            </label>
            <label>
              Minimum
              <input type="number" data-option="slider-min" min="20" max="20000" step="1" value="20">
            </label>
            <label>
              Maximum
              <input type="number" data-option="slider-max" min="20" max="20000" step="1" value="20000">
            </label>
            <label>
              Value step
              <input type="number" data-option="slider-step" min="0.001" max="20000" step="any" value="1">
            </label>
            <label class="check">
              <input type="checkbox" data-option="slider-editable" checked>
              Editable value
            </label>
            <label>
              Curve midpoint
              <input type="number" data-option="slider-mid" min="20" max="20000" step="1" value="1000">
            </label>
            <label>
              Reset value
              <input type="number" data-option="slider-reset" min="20" max="20000" step="1" value="1000">
            </label>
            <output data-option-state>Horizontal · log · 20–20000 · step 1 · mid 1000 · reset 1000 · editable</output>
          </fieldset>
          <div class="demo-showcase">
            <p class="muted">Click or drag the track for normal travel. Option-drag, Shift-drag, or drag the second click for fine movement. Double-click without moving, Escape, Delete, or Backspace resets.</p>
            <compost-slider
              parameter-id="feedback"
              label="Feedback"
              min="0"
              max="0.95"
              value="0.4"
              step="0.001"
              orientation="vertical"
              editable
            ></compost-slider>
            <compost-slider
              parameter-id="cutoff"
              label="Log Cutoff"
              min="20"
              max="20000"
              mid="1000"
              curve="log"
              value="1000"
              step="1"
              unit=" Hz"
              reset-value="1000"
              editable
              data-option-target="slider"
            ></compost-slider>
          </div>
        </div>
      </section>
      <section class="panel wide">
        <h2>Events</h2>
        <pre class="log" data-log></pre>
      </section>
    </main>
  </body>
</html>
