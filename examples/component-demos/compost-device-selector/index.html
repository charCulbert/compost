<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost demo</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <script type="module" src="../../../src/components/compost-device-selector.js" data-usage-import></script>
    <script type="module" src="../shared-demo.js"></script>
    <style>
      .device-demo-status {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));
        gap: 10px;
        margin-top: 16px;
      }

      .device-demo-status output {
        display: grid;
        gap: 4px;
        min-height: 44px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
      }

      .device-demo-status output span {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body data-demo="compost-device-selector">
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 data-title>Demo</h1>
          <p class="muted" data-summary></p>
        </div>
        <div class="example-link-group">
          <a class="example-nav-button" href="../../../docs/?doc=compost-device-selector">Docs</a>
          <a class="example-nav-button" href="../../">All examples</a>
        </div>
      </header>
      <section class="panel" data-demo-root>
        <template data-usage-example>
          <compost-device-selector label="Device settings" heading="Audio &amp; MIDI settings"></compost-device-selector>
        </template>
        <compost-device-selector label="Device settings" heading="Audio &amp; MIDI settings"></compost-device-selector>
        <div class="device-demo-status" aria-label="Current fake native device state">
          <output>
            <span>Audio output</span>
            <strong data-device-demo-state="output"></strong>
          </output>
          <output>
            <span>Sample rate</span>
            <strong data-device-demo-state="sampleRate"></strong>
          </output>
          <output>
            <span>Buffer size</span>
            <strong data-device-demo-state="bufferSize"></strong>
          </output>
          <output>
            <span>MIDI outputs</span>
            <strong data-device-demo-state="midiOutputs"></strong>
          </output>
        </div>
      </section>
      <section class="panel wide">
        <h2>Events</h2>
        <pre class="log" data-log></pre>
      </section>
    </main>
  </body>
</html>
