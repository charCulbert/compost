<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost demo</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <script type="module" src="../../../src/components/compost-midi.js" data-usage-import></script>
    <script type="module" src="../../../src/components/compost-midi-monitor.js" data-usage-import></script>
    <script type="module" src="../shared-demo.js"></script>
  </head>
  <body data-demo="compost-midi">
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 data-title>Demo</h1>
          <p class="muted" data-summary></p>
        </div>
        <div class="example-link-group">
          <a class="example-nav-button" href="../../">All examples</a>
        </div>
      </header>
      <section class="panel" data-demo-root>
        <p class="muted">Select a real MIDI input or output. The monitor shows incoming messages; output selection enables <code>send()</code> for application code.</p>
        <compost-midi id="midi"></compost-midi>
      </section>
      <section class="panel wide">
        <h2>MIDI Monitor</h2>
        <p class="muted">Select a MIDI input above, then play notes or move controls to see incoming messages.</p>
        <compost-midi-monitor for="midi" max-lines="10"></compost-midi-monitor>
      </section>
    </main>
  </body>
</html>
