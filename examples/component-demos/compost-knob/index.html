<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost demo</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <script type="module" src="../../../src/components/compost-knob.js" data-usage-import></script>
    <script type="module" src="../shared-demo.js"></script>
  </head>
  <body data-demo="compost-knob">
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 data-title>Demo</h1>
          <p class="muted" data-summary></p>
        </div>
        <div class="example-link-group">
          <a class="example-nav-button" href="../../../docs/?doc=compost-knob">Docs</a>
          <a class="example-nav-button" href="../../">All examples</a>
        </div>
      </header>
      <section class="panel" data-demo-root>
        <div class="demo-playground">
          <fieldset class="demo-options">
            <legend>Options</legend>
            <label>
              Curve
              <compost-select data-option="knob-curve">
                <option value="linear">Linear</option>
                <option value="log" selected>Log</option>
              </compost-select>
            </label>
            <label>
              Minimum
              <input type="number" data-option="knob-min" min="20" max="20000" step="1" value="20">
            </label>
            <label>
              Maximum
              <input type="number" data-option="knob-max" min="20" max="20000" step="1" value="20000">
            </label>
            <label>
              Value step
              <input type="number" data-option="knob-step" min="0.001" max="20000" step="any" value="1">
            </label>
            <label class="check">
              <input type="checkbox" data-option="knob-editable" checked>
              Editable value
            </label>
            <label>
              Curve midpoint
              <input type="number" data-option="knob-mid" min="20" max="20000" step="1" value="1000">
            </label>
            <label>
              Reset value
              <input type="number" data-option="knob-reset" min="20" max="20000" step="1" value="220">
            </label>
            <output data-option-state>Log · 20–20000 · step 1 · mid 1000 · reset 220</output>
          </fieldset>
          <div class="demo-showcase">
            <p class="muted">Drag normally for full travel. Option-drag or drag the second click for fine movement. Double-click without moving resets.</p>
            <div class="control-row">
              <compost-knob
                parameter-id="cutoff"
                label="Log Cutoff"
                min="20"
                max="20000"
                mid="1000"
                curve="log"
                value="1000"
                reset-value="220"
                step="1"
                unit=" Hz"
                editable
                data-option-target="knob"
                data-usage-example
              ></compost-knob>
              <compost-knob
                parameter-id="mix"
                label="Linear Mix"
                min="0"
                max="1"
                value="0.35"
                step="0.01"
                reset-value="0.35"
                editable
              ></compost-knob>
            </div>
          </div>
        </div>
      </section>
      <section class="panel wide">
        <h2>Events</h2>
        <pre class="log" data-log></pre>
      </section>
    </main>
  </body>
</html>
