<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost demo</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <link rel="stylesheet" href="../../shared/scope-controls.css">
    <style>
      [data-demo="compost-scope"] .scope-stack {
        --signal-scope-height: clamp(280px, 42vw, 440px);
      }

      [data-demo="compost-scope"] .scope-demo-control-grid {
        grid-template-columns: repeat(2, minmax(210px, 260px));
      }

      [data-demo="compost-scope"] .scope-toggle-buttons {
        font-size: 12px;
      }

      [data-demo="compost-scope"] .scope-number-column:first-child {
        border-left: 0;
      }

      [data-demo="compost-scope"] .scope-number-column .scope-number-control {
        grid-template-columns: minmax(0, 1fr) 82px;
      }

      [data-demo="compost-scope"] .scope-number-control compost-number-box {
        --number-box-height: 24px;
        --number-box-font-size: 12px;
      }

      [data-demo="compost-scope"] .scope-number-control compost-select {
        width: 82px;
        --compost-select-height: 24px;
      }

      [data-demo="compost-scope"] .scope-option-state {
        padding: 0 10px 10px;
        color: var(--muted);
        font-size: 11px;
      }

      [data-demo="compost-scope"] .scope-readouts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        border: 1px solid var(--line);
        background: var(--line);
      }

      [data-demo="compost-scope"] .scope-readouts div {
        display: grid;
        gap: 4px;
        padding: 9px 10px;
        background: var(--panel);
      }

      [data-demo="compost-scope"] .scope-readouts span {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
      }

      [data-demo="compost-scope"] .scope-readouts output {
        overflow: hidden;
        color: var(--text);
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (max-width: 680px) {
        [data-demo="compost-scope"] .scope-stack {
          --signal-scope-height: 260px;
        }

        [data-demo="compost-scope"] .scope-demo-control-grid,
        [data-demo="compost-scope"] .scope-readouts {
          grid-template-columns: 1fr;
        }

        [data-demo="compost-scope"] .scope-number-column {
          width: 100%;
          border-top: 1px solid var(--line);
          border-left: 0;
        }
      }
    </style>
    <script type="module" src="../../../src/components/compost-number-box.js" data-usage-import></script>
    <script type="module" src="../../../src/components/compost-scope.js" data-usage-import></script>
    <script type="module" src="../shared-demo.js"></script>
  </head>
  <body data-demo="compost-scope">
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 data-title>Demo</h1>
          <p class="muted" data-summary></p>
        </div>
        <div class="example-link-group">
          <a class="example-nav-button" href="../../../docs/?doc=compost-scope">Docs</a>
          <a class="example-nav-button" href="../../">All examples</a>
        </div>
      </header>

      <section class="panel" data-demo-root>
        <div class="scope-stack">
          <compost-scope
            demo
            channels="1"
            trigger="up"
            trigger-level="0"
            periods-shown="4"
            samples-shown="1024"
            value-range="1"
            y-offset="0"
            x-marker-labels="1,2,3,4"
            y-marker-labels="-0.5,0,0.5"
            trace-colors="#f3c969,#67d4ff,#ff7f66"
            data-option-target="scope"
          ></compost-scope>

          <div class="scope-toggle scope-trigger-toggle" role="group" aria-label="Trigger type">
            <span>Trigger</span>
            <div class="scope-toggle-buttons">
              <button type="button" data-scope-trigger-value="off" aria-pressed="false">Off</button>
              <button type="button" data-scope-trigger-value="up" aria-label="Rising edge" aria-pressed="true">↑</button>
              <button type="button" data-scope-trigger-value="down" aria-label="Falling edge" aria-pressed="false">↓</button>
              <button type="button" data-scope-trigger-value="external" aria-pressed="false">Ext</button>
              <button type="button" data-scope-trigger-value="manual" aria-pressed="false">Man</button>
            </div>
          </div>

          <div class="scope-toggle scope-window-toggle" role="group" aria-label="Window type">
            <span>Window</span>
            <div class="scope-toggle-buttons">
              <button type="button" data-scope-window-value="periods" aria-pressed="true">Periods</button>
              <button type="button" data-scope-window-value="samples" aria-pressed="false">Samples</button>
            </div>
          </div>

          <div class="scope-controls">
            <div class="scope-control-grid scope-demo-control-grid">
              <div class="scope-number-column">
                <label class="scope-number-control">
                  <span>Reference frequency</span>
                  <compost-number-box name="Reference Frequency" label="Reference Frequency"
                    min="55" max="880" step="1" value="220" unit="Hz"
                    data-option="scope-frequency"></compost-number-box>
                </label>
                <label class="scope-number-control">
                  <span>Channels</span>
                  <compost-select data-option="scope-channels">
                    <option value="1" selected>1</option>
                    <option value="2">2</option>
                  </compost-select>
                </label>
                <label class="scope-number-control">
                  <span>Trigger level</span>
                  <compost-number-box name="Trigger Level" label="Trigger Level"
                    min="-1" max="1" step="0.01" value="0"
                    data-option="scope-trigger-level"></compost-number-box>
                </label>
              </div>

              <div class="scope-number-column">
                <label class="scope-number-control" data-window-control="periods">
                  <span>Periods shown</span>
                  <compost-number-box name="Periods Shown" label="Periods Shown"
                    min="1" max="16" step="1" value="4"
                    data-option="scope-periods"></compost-number-box>
                </label>
                <label class="scope-number-control" data-window-control="samples" hidden>
                  <span>Samples shown</span>
                  <compost-number-box name="Samples Shown" label="Samples Shown"
                    min="64" max="4096" step="64" value="1024"
                    data-option="scope-samples"></compost-number-box>
                </label>
                <label class="scope-number-control">
                  <span>Vertical range</span>
                  <compost-number-box name="Vertical Range" label="Vertical Range"
                    min="0.1" max="2" step="0.05" value="1"
                    data-option="scope-range"></compost-number-box>
                </label>
                <label class="scope-number-control">
                  <span>Vertical center</span>
                  <compost-number-box name="Vertical Center" label="Vertical Center"
                    min="-2" max="2" step="0.05" value="0"
                    data-option="scope-center"></compost-number-box>
                </label>
              </div>

              <div class="scope-label-editors">
                <label class="scope-label-editor">
                  <span>X labels</span>
                  <input type="text" value="1,2,3,4" data-option="scope-x-labels">
                </label>
                <label class="scope-label-editor">
                  <span>Y labels</span>
                  <input type="text" value="-0.5,0,0.5" data-option="scope-y-labels">
                </label>
              </div>
            </div>
            <output class="scope-option-state" data-option-state>1 channel · 4 periods · rising</output>
          </div>
        </div>

        <div class="scope-readouts" aria-label="Scope status">
          <div>
            <span>Signal</span>
            <output data-scope-signal>Generated · 220 Hz</output>
          </div>
          <div>
            <span>View</span>
            <output data-scope-view>1 channel · 4 periods · ±1 centered at 0</output>
          </div>
          <div>
            <span>Sync</span>
            <output data-scope-sync>Rising edge at 0.00</output>
          </div>
        </div>
      </section>

      <section class="panel wide">
        <h2>Events</h2>
        <pre class="log" data-log></pre>
      </section>
    </main>
  </body>
</html>
