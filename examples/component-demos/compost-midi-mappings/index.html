<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost demo</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <script type="module" src="../../../src/components/compost-midi.js" data-usage-import></script>
    <script type="module" src="../../../src/components/compost-midi-mappings.js" data-usage-import></script>
    <script type="module" src="../../../src/components/compost-knob.js" data-usage-import></script>
    <script type="module" src="../../../src/components/compost-slider.js" data-usage-import></script>
    <script type="module" src="../../../src/components/compost-button.js" data-usage-import></script>
    <script type="module" src="../shared-demo.js"></script>
  </head>
  <body data-demo="compost-midi-mappings">
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 data-title>Demo</h1>
          <p class="muted" data-summary></p>
        </div>
        <div class="example-link-group">
          <a class="example-nav-button" href="../../">All examples</a>
        </div>
      </header>
      <section class="panel" data-demo-root>
        <p class="muted">Select a real MIDI input, press Map MIDI to learn a CC, then edit the compact table. Focus a row and press Delete to clear it. One CC can map multiple controls.</p>
        <compost-midi id="midi" input-only></compost-midi>
        <compost-knob
          parameter-id="cutoff"
          label="Cutoff"
          section="Filter"
          min="20"
          max="20000"
          value="800"
          step="1"
          unit="Hz"
          editable
        ></compost-knob>
        <compost-slider
          parameter-id="resonance"
          label="Resonance"
          section="Filter"
          min="0"
          max="1"
          value="0.25"
          step="0.001"
          editable
        ></compost-slider>
        <compost-button
          parameter-id="panic"
          label="Panic"
          section="Actions"
        ></compost-button>
        <compost-midi-mappings label="Mappings"></compost-midi-mappings>
      </section>
    </main>
  </body>
</html>
