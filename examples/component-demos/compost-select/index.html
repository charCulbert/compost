<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost demo</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <script type="module" src="../../../src/components/compost-select.js" data-usage-import></script>
    <script type="module" src="../shared-demo.js"></script>
  </head>
  <body data-demo="compost-select">
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 data-title>Demo</h1>
          <p class="muted" data-summary></p>
        </div>
        <div class="example-link-group">
          <a class="example-nav-button" href="../../../docs/?doc=compost-select">Docs</a>
          <a class="example-nav-button" href="../../">All examples</a>
        </div>
      </header>
      <section class="panel" data-demo-root>
        <div class="demo-showcase">
          <p class="muted">Open it, use arrow keys, or type an option name.</p>
          <compost-select value="saw" aria-label="Wave shape">
            <option value="sine">Sine</option>
            <option value="saw">Saw</option>
            <option value="square">Square</option>
          </compost-select>
        </div>
      </section>
    </main>
  </body>
</html>
