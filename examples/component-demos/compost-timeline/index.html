<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost demo</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <script type="module" src="../../../src/components/compost-timeline.js" data-usage-import></script>
    <script type="module" src="../shared-demo.js"></script>
  </head>
  <body data-demo="compost-timeline">
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 data-title>Demo</h1>
          <p class="muted" data-summary></p>
        </div>
        <div class="example-link-group">
          <a class="example-nav-button" href="../../">All examples</a>
        </div>
      </header>
      <section class="panel" data-demo-root>
        <div class="demo-playground">
          <fieldset class="demo-options">
            <legend>Host</legend>
            <label class="check"><input type="checkbox" data-play> Play head</label>
            <label class="check"><input type="checkbox" data-loop> Loop</label>
            <label class="check"><input type="checkbox" data-automation> Automation view</label>
            <label class="check"><input type="checkbox" data-draw> Draw automation</label>
            <label>Lane A <select data-lane-automation="lane-a"><option value="gain">Gain</option><option value="pan">Pan</option><option value="">None</option></select></label>
            <label>Lane B <select data-lane-automation="lane-b"><option value="pan">Pan</option><option value="gain">Gain</option><option value="">None</option></select></label>
            <label>Lane C <select data-lane-automation="lane-c"><option value="gain">Gain</option><option value="pan">Pan</option><option value="">None</option></select></label>
            <button type="button" data-reset>Reset view</button>
            <output data-state>stopped · beat 0</output>
            <p class="muted">The host supplies three lanes and receives every timeline intent in the log. Drag a clip, trim an edge, or use the keyboard while the play head runs.</p>
          </fieldset>
          <compost-timeline id="timeline" label="Timeline" beats-per-bar="4" grid="1/4" snap="off" style="height:360px; width:100%;"></compost-timeline>
        </div>
      </section>
      <section class="panel wide">
        <h2>Events</h2>
        <pre class="log" data-log></pre>
      </section>
    </main>
    <script type="module">
      const requestedTheme = new URLSearchParams(location.search).get('theme');
      if (requestedTheme === 'light' || requestedTheme === 'dark') document.documentElement.dataset.compostTheme = requestedTheme;
      const timeline = document.querySelector('#timeline');
      const log = document.querySelector('[data-log]');
      const state = document.querySelector('[data-state]');
      const play = document.querySelector('[data-play]');
      const loop = document.querySelector('[data-loop]');
      const automation = document.querySelector('[data-automation]');
      const draw = document.querySelector('[data-draw]');
      const lanes = [
        { id: 'lane-a', name: 'Lane A', picked: true, automation: { id: 'gain', label: 'Gain', min: 0, max: 1, stepped: false, value: .6, points: [{ beat: 0, value: .2 }, { beat: 4, value: .8 }, { beat: 8, value: .6 }] }, clips: [
          { id: 'clip-1', name: 'Clip 1', start: 0, length: 8, duration: 2, offset: 0, loop: true, state: 'stopped', notes: [{ start: 0, duration: .25, note: 36, velocity: 30 }, { start: .5, duration: .25, note: 42, velocity: 80 }, { start: 1, duration: .25, note: 38, velocity: 120 }] },
          { id: 'clip-2', name: 'Clip 2', start: 10, length: 4, duration: 4, offset: 0, loop: false, state: 'stopped', notes: [{ start: 0, duration: .5, note: 45 }, { start: 1, duration: .25, note: 48 }] },
        ] },
        { id: 'lane-b', name: 'Lane B', automation: { id: 'pan', label: 'Pan', min: -1, max: 1, stepped: false, value: 0, points: [{ beat: 0, value: -.5 }, { beat: 6, value: .5 }] }, clips: [
          { id: 'clip-3', name: 'Clip 3', start: 4, length: 12, duration: 4, offset: 0, loop: true, state: 'playing', notes: [{ start: 0, duration: 1, note: 40 }, { start: 1.5, duration: .5, note: 43 }] },
        ] },
        { id: 'lane-c', name: 'Lane C', dimmed: true, automation: { id: 'gain', label: 'Gain', min: 0, max: 1, stepped: false, value: .7, points: [{ beat: 2, value: .2 }, { beat: 8, value: .7 }] }, clips: [
          { id: 'clip-4', name: 'Clip 4', start: 2, length: 6, duration: 6, offset: 0, loop: false, state: 'open', notes: [{ start: 0, duration: 2, note: 60 }, { start: 2, duration: 2, note: 64 }] },
        ] },
      ];
      timeline.setLanes(lanes);
      timeline.setLocators([
        { id: 'marker-a', beat: 0, name: 'Marker A' },
        { id: 'marker-b', beat: 8, name: 'Marker B' },
      ]);
      timeline.setTimeSelection(null, null);
      timeline.setLoop(0, 8, false);
      timeline.setPlayhead(0);
      automation.addEventListener('change', () => timeline.toggleAttribute('automation', automation.checked));
      draw.addEventListener('change', () => timeline.toggleAttribute('draw', draw.checked));
      const automationChoices = {
        gain: { id: 'gain', label: 'Gain', min: 0, max: 1, stepped: false, points: [{ beat: 0, value: .25 }, { beat: 8, value: .8 }] },
        pan: { id: 'pan', label: 'Pan', min: -1, max: 1, stepped: false, points: [{ beat: 0, value: -.5 }, { beat: 8, value: .5 }] },
      };
      for (const select of document.querySelectorAll('[data-lane-automation]')) {
        select.addEventListener('change', () => {
          const choice = automationChoices[select.value];
          timeline.setLaneAutomation(select.dataset.laneAutomation, choice ? structuredClone(choice) : null);
        });
      }
      for (const type of ['seek', 'locator-jump', 'locator-prev', 'locator-next', 'locator-move', 'locator-create', 'locator-rename', 'locator-context', 'fit-request', 'time-select-input', 'time-select', 'time-delete', 'time-duplicate', 'loop-input', 'loop-change', 'loop-toggle', 'clip-select', 'clip-open', 'clip-context', 'lane-context', 'lane-create', 'lanes-context', 'lanes-create', 'lane-header-context', 'lane-pick', 'lane-move', 'automation-change', 'draw-toggle', 'automation-context', 'clip-move', 'clip-trim-input', 'clip-trim', 'clip-rename', 'clip-delete', 'clip-duplicate', 'clip-split', 'clip-nudge', 'view-change']) {
        timeline.addEventListener(type, (event) => {
          const detail = { ...event.detail };
          delete detail.clientX;
          delete detail.clientY;
          log.textContent = `${type} ${JSON.stringify(detail)}\n${log.textContent}`.slice(0, 5000);
          // the element only asks; this page is the host that applies loop and automation edits
          if (type === 'loop-change') {
            loop.checked = detail.enabled;
            timeline.setLoop(detail.start, detail.end, detail.enabled);
          }
          if (type === 'loop-toggle') {
            loop.checked = detail.enabled;
            timeline.setLoop(timeline.loopStart, timeline.loopEnd, detail.enabled);
          }
          if (type === 'automation-change') {
            const lane = timeline.lanes.find((entry) => entry.id === detail.laneId);
            if (lane?.automation?.id === detail.automationId) {
              lane.automation.points = detail.points.map((point) => ({ ...point }));
              timeline.setLaneAutomation(lane.id, lane.automation);
            }
          }
          if (type === 'seek') timeline.setPlayhead(detail.beat);
          if (type === 'fit-request') timeline.zoomToFit(16);
          if (type === 'draw-toggle') {
            draw.checked = Boolean(detail.enabled);
            timeline.toggleAttribute('draw', draw.checked);
          }
        });
      }
      let frame = 0;
      let last = performance.now();
      function tick(now) {
        const delta = Math.max(0, now - last) / 1000;
        last = now;
        if (play.checked) {
          let beat = timeline.playhead + delta * 2;
          if (loop.checked && beat >= 8) beat %= 8;
          timeline.setPlayhead(beat);
          state.textContent = `playing · beat ${beat.toFixed(2)}`;
        } else state.textContent = `stopped · beat ${timeline.playhead.toFixed(2)}`;
        frame = requestAnimationFrame(tick);
      }
      frame = requestAnimationFrame(tick);
      loop.addEventListener('change', () => timeline.setLoop(0, 8, loop.checked, true));
      document.querySelector('[data-reset]').addEventListener('click', () => {
        timeline.scrollTo(0);
        timeline.zoomToFit(16);
        timeline.setPlayhead(0);
      });
      window.addEventListener('pagehide', () => cancelAnimationFrame(frame));
    </script>
  </body>
</html>
