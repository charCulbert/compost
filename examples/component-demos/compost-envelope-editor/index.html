<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compost demo</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <script type="module" src="../../../src/components/compost-envelope-editor.js" data-usage-import></script>
    <script type="module" src="../shared-demo.js"></script>
  </head>
  <body data-demo="compost-envelope-editor">
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 data-title>Demo</h1>
          <p class="muted" data-summary></p>
        </div>
        <div class="example-link-group">
          <a class="example-nav-button" href="../../../docs/?doc=compost-envelope-editor">Docs</a>
          <a class="example-nav-button" href="../../">All examples</a>
        </div>
      </header>
      <section class="panel" data-demo-root>
        <div class="demo-playground">
          <fieldset class="demo-options">
            <legend>Host</legend>
            <label class="check"><input type="checkbox" data-draw> Draw</label>
            <label class="check"><input type="checkbox" data-snap checked> Snap</label>
            <label class="check"><input type="checkbox" data-stepped> Stepped</label>
            <output data-state>3 points</output>
            <p class="muted">Double-click or double-tap to add a point; keep the second touch down to drag it immediately. Drag points or segments, use Alt for free time, Shift for fine movement, and Delete or the arrow keys on a focused point.</p>
          </fieldset>
          <div class="demo-showcase" style="display:block">
            <compost-envelope-editor label="Envelope" duration="8" min="0" max="1" grid="0.5" style="height:180px"></compost-envelope-editor>
          </div>
        </div>
      </section>
      <section class="panel wide">
        <h2>Events</h2>
        <pre class="log" data-log></pre>
      </section>
    </main>
    <script type="module">
      const editor = document.querySelector('compost-envelope-editor');
      const draw = document.querySelector('[data-draw]');
      const snap = document.querySelector('[data-snap]');
      const stepped = document.querySelector('[data-stepped]');
      const state = document.querySelector('[data-state]');
      const log = document.querySelector('[data-log]');
      editor.points = [{ time: 0, value: .2 }, { time: 3, value: .8 }, { time: 8, value: .45 }];
      const report = () => { state.textContent = `${editor.points.length} points`; };
      editor.addEventListener('envelope-change', ({ detail }) => {
        editor.points = detail.points;
        report();
        log.textContent = `envelope-change ${JSON.stringify(detail)}\n${log.textContent}`.slice(0, 5000);
      });
      editor.addEventListener('envelope-context', ({ detail }) => {
        log.textContent = `envelope-context ${JSON.stringify(detail)}\n${log.textContent}`.slice(0, 5000);
      });
      draw.addEventListener('change', () => editor.toggleAttribute('draw', draw.checked));
      snap.addEventListener('change', () => editor.setAttribute('snap', snap.checked ? 'grid' : 'off'));
      stepped.addEventListener('change', () => editor.toggleAttribute('stepped', stepped.checked));
      report();
    </script>
  </body>
</html>
